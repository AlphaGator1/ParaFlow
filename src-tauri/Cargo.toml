[package]
name = "flowstate"
version = "0.1.0"
description = "Local-first push-to-talk dictation for Windows"
edition = "2021"
rust-version = "1.77"

[lib]
name = "flowstate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio capture + resampling
cpal = "0.15"
rubato = "0.15"
hound = "3.5"

# Concurrency
crossbeam-channel = "0.5"
parking_lot = "0.12"
once_cell = "1"

# ASR sidecar transport
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }

# Diagnostics
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Ole",
    "Win32_Globalization",
    # PlaySoundW, for the session start/stop chimes.
    "Win32_Media_Audio",
    # CreateJobObjectW takes SECURITY_ATTRIBUTES, so the JobObjects bindings
    # are gated behind this even though we always pass null.
    "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
